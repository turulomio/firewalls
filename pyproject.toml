[tool.poetry]
name = "firewalls"
version = "0.1.0"
description = "Centralized firewalld configuration and deployment manager for Gentoo Linux"
authors = ["worky"]
readme = "README.md"
packages = [{include = "firewalls"}]

[tool.poetry.dependencies]
python = "^3.10"
colorama = "^0.4.6"
poethepoet = "^0.49.0"

[tool.poetry.scripts]
firewalls_deploy = "firewalls.cli:main"
firewalls_log_ingress = "firewalls.log_ingress:main"
firewalls_log_egress = "firewalls.log_egress:main"
firewalls_monitor = "firewalls.monitor:main"
firewalls_probes = "firewalls.probes:main"

[tool.poe.tasks]
translate = { script = "firewalls.poethepoet:translate" }
release = { script = "firewalls.poethepoet:release" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
