[tool.poetry]
name = "firewalls"
version = "0.1.0"
description = "Gestor de configuraciones y despliegue de firewalld en Gentoo"
authors = ["worky"]
readme = "README.md"
packages = [{include = "firewalls"}]

[tool.poetry.dependencies]
python = "^3.10"
colorama = "^0.4.6"

[tool.poetry.scripts]
firewalls_deploy = "firewalls.cli:main"
firewalls_log_ingress = "firewalls.log_ingress:main"
firewalls_log_egress = "firewalls.log_egress:main"
firewalls_monitor = "firewalls.monitor:main"
firewalls_probes = "firewalls.probes:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
