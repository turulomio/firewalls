# Default configuration for firewalld on Gentoo Linux
# Documentation: man firewalld.conf

# Default zone
DefaultZone=public

# Clean up on exit or stop
CleanupOnExit=yes

# Lockdown (limits D-Bus interface changes to users/commands in lockdown-whitelist.xml)
Lockdown=yes

# Reverse Path Filter check on IPv6
IPv6_rpfilter=yes

# Rule individual calls or combined restore
IndividualCalls=no

# Log denied packets. Options: 'all', 'unicast', 'broadcast', 'multicast', 'off'.
# 'off' by default to keep dmesg clean; CLI monitors enable it on demand.
LogDenied=off

# Automatic helper assignment
AutomaticHelpers=system

# Firewall backend implementation (nftables recommended)
FirewallBackend=nftables

# Flush all runtime rules on reload
FlushAllOnReload=yes

# Filter IPv6-in-IPv4 packets as per RFC 3964
RFC3964_IPv4=yes
