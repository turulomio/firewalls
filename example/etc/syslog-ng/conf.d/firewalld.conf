# syslog-ng configuration for firewalld on Gentoo Linux
# /etc/syslog-ng/conf.d/firewalld.conf

# 1. Daemon service logs for firewalld
filter f_firewalld { program("firewalld"); };
destination d_firewalld { file("/var/log/firewalld/firewalld.log"); };
log { source(src); filter(f_firewalld); destination(d_firewalld); flags(final); };

# 2. Denied and dropped packet logs (LogDenied=all or unicast)
filter f_firewalld_all_denied {
    match("_REJECT|_DROP|_DENIED|FINAL_REJECT|FINAL_DROP" value("MESSAGE") flags(ignore-case));
};

# Noise exclusions to prevent log flooding (adjust according to your network environment):
filter f_firewalld_denied {
    filter(f_firewalld_all_denied)
    # Example: discard local network mDNS noise (UDP port 5353)
    and not match("DPT=5353" value("MESSAGE"))
    # Example: discard ICMPv6 router advertisement noise
    and not match("PROTO=ICMPv6" value("MESSAGE") flags(ignore-case));
};

# Rate-limiting with throttle(30) to prevent disk exhaustion from DoS or log flooding attacks
destination d_firewalld_denied { file("/var/log/firewalld/denied.log" throttle(30)); };
log { source(src); filter(f_firewalld_denied); destination(d_firewalld_denied); flags(final); };

# 3. Discard any remaining firewall drop logs (the excluded noise above)
# so they do not leak into /var/log/messages or subsequent catch-all destinations
log { source(src); filter(f_firewalld_all_denied); flags(final); };
